<script>
/* Also evict any stale service worker / cache left by the previous site. */
(function(){
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){});
    }
    if (window.caches && caches.keys) { caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){}); }
  } catch(e){}
})();
</script>
<style>

  a.solid { background:var(--mist); color:var(--deep); font-weight:600; }
  a.ghost { border:1px solid rgba(255,255,255,.28); color:#e7eef3; }
  a.btn:hover { transform:translateY(-2px); }
