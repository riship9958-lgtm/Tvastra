<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 700" font-family="Quicksand, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="vn-wind" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#2f7fb8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="vn-sun" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto">
      <path d="M1 1.5 L7.5 5 L1 8.5" fill="none" stroke="#e9b83a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="vn-sunicon">
      <circle r="14" fill="#f6c445"/>
      <g stroke="#f6c445" stroke-width="2.8" stroke-linecap="round">
        <line x1="0" y1="-19" x2="0" y2="-25"/><line x1="0" y1="19" x2="0" y2="25"/>
        <line x1="-19" y1="0" x2="-25" y2="0"/><line x1="19" y1="0" x2="25" y2="0"/>
        <line x1="-14" y1="-14" x2="-18" y2="-18"/><line x1="14" y1="14" x2="18" y2="18"/>
        <line x1="14" y1="-14" x2="18" y2="-18"/><line x1="-14" y1="14" x2="-18" y2="18"/>
      </g>
    </g>
  </defs>

  <!-- building footprint -->
  <g transform="rotate(12 310 350)">
    <rect x="215" y="215" width="210" height="270" rx="3" fill="#3f76b5" fill-opacity="0.85" stroke="#1b2a32" stroke-width="2.4"/>
  </g>

  <!-- sun path: east (right) -> south dip -> west (left) -->
  <path d="M545 400 C 500 470, 400 520, 300 520 C 200 520, 130 470, 78 405"
        fill="none" stroke="#e9b83a" stroke-width="3" stroke-dasharray="13 11" stroke-linecap="round" marker-end="url(#vn-sun)"/>
  <use href="#vn-sunicon" x="548" y="398"/>
  <use href="#vn-sunicon" x="300" y="520"/>
  <use href="#vn-sunicon" x="74" y="404"/>

  <!-- prevailing wind: NE stream in, SW stream in -->
  <g fill="none" stroke="#2f7fb8" stroke-width="3" stroke-dasharray="13 10" stroke-linecap="round">
    <path d="M560 70 C 470 95, 445 140, 420 180" marker-end="url(#vn-wind)"/>
    <path d="M600 130 C 500 150, 470 175, 440 200" marker-end="url(#vn-wind)"/>
    <path d="M40 610 C 120 585, 150 560, 175 520" marker-end="url(#vn-wind)"/>
    <path d="M90 645 C 160 620, 185 600, 205 560" marker-end="url(#vn-wind)"/>
  </g>

  <!-- labels -->
  <text x="300" y="600" text-anchor="middle" font-size="16" letter-spacing="2.5" fill="#b78a13">SUN PATH · E → W</text>
  <text x="600" y="46" text-anchor="end" font-size="15" letter-spacing="2" fill="#2f7fb8">PREVAILING WIND</text>

  <!-- compass -->
  <g transform="translate(556 636)">
    <circle r="32" fill="#ffffff" stroke="#d5dce1" stroke-width="1.4"/>
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#8a929b" stroke-width="1"/>
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#8a929b" stroke-width="1"/>
    <path d="M0 -28 L6 0 L0 6 L-6 0 Z" fill="#1b2a32"/>
    <path d="M0 28 L6 0 L0 -6 L-6 0 Z" fill="#c2c8cf"/>
    <text x="0" y="-42" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2a32">N</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" fill="#6d7a82">S</text>
    <text x="46" y="5" text-anchor="middle" font-size="11" fill="#6d7a82">E</text>
    <text x="-46" y="5" text-anchor="middle" font-size="11" fill="#6d7a82">W</text>
    <line x1="0" y1="0" x2="-20" y2="20" stroke="#d64f4f" stroke-width="2.2" stroke-linecap="round"/>
    <text x="-19" y="38" text-anchor="middle" font-size="11" font-weight="600" fill="#d64f4f">SW</text>
  </g>
</svg>
